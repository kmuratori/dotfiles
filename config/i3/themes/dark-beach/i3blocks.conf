# ── MPD / NOW PLAYING ──────────────────────────────────────────
[mpd]
command=~/.config/i3blocks/mpd_control.sh
color=#c8b4f0
interval=1
signal=10
separator=false

# ── SOWON TIMER ────────────────────────────────────────────────
[sowon]
command=~/.config/i3blocks/timer/info.sh
color=#9D6EE8
interval=1
separator=false

# ── DISK ───────────────────────────────────────────────────────
[disk]
command=~/.config/i3blocks/disk.sh
color=#4a8fd4
interval=30
separator=false

# ── MEMORY ─────────────────────────────────────────────────────
[mem]
command=~/.config/i3blocks/ram.sh
color=#9D6EE8
interval=1
separator=false

# ── BATTERY ────────────────────────────────────────────────────
[battery]
command=~/.config/i3blocks/battery/battery_info.sh
color=#c8b4f0
interval=2
separator=false

# ── VOLUME ─────────────────────────────────────────────────────
[sound]
full_text=  🔇:  0%
command=~/.config/i3blocks/sound/sound_info.sh
color=#e05c7a
interval=0
signal=1
separator=false

# ── WEATHER ────────────────────────────────────────────────────
# [weather]
# command=~/.config/i3blocks/weather.sh
# color=#4a8fd4
# interval=1800
# separator=false

# ── DATE ───────────────────────────────────────────────────────
[date]
command=~/.config/i3blocks/date.sh
color=#a89bc5
interval=60
separator=false

# ── TIME ───────────────────────────────────────────────────────
[time]
command=~/.config/i3blocks/time.sh
color=#ede9f8
interval=1
separator=false
