# dark-beach picom.conf
# Backend: glx

backend = "glx";
glx-copy-from-front = false;
use-damage = true;

# Shadows
shadow = false;
shadow-radius = 18;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.60;
shadow-color = "#000000";

shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g = 'slop'",
    "_GTK_FRAME_EXTENTS@",
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "window_type = 'tooltip'"
];

# Fading
fading = true;
fade-in-step  = 0.03;
fade-out-step = 0.03;
fade-delta    = 4;

# Transparency
inactive-opacity = 0.88;
active-opacity   = 1.0;
frame-opacity    = 0.9;
inactive-opacity-override = false;

opacity-rule = [
    "95:class_g = 'Alacritty' && focused",
    "80:class_g = 'Alacritty' && !focused",
    "92:class_g = 'qutebrowser'",
    "85:class_g = 'Rofi'",
    "90:class_g = 'ncmpcpp'",
    "100:class_g = 'mpv'",
    "100:class_g = 'nsxiv'",
    "100:window_type = 'dock'"
];

# Blur
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;

blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'slop'",
    "_GTK_FRAME_EXTENTS@"
];

# Window type settings
wintypes:
{
    tooltip       = { fade = true; shadow = false; opacity = 0.90; focus = true; };
    dock          = { shadow = false; clip-shadow-above = true; };
    dnd           = { shadow = false; };
    popup_menu    = { opacity = 0.90; };
    dropdown_menu = { opacity = 0.90; };
};

# Misc
mark-wmwin-focused     = true;
mark-ovredir-focused   = true;
detect-rounded-corners = false;
detect-client-opacity  = true;
detect-transient       = true;
detect-client-leader   = true;
vsync                  = true;
unredir-if-possible    = false;
