[window]
padding = { x = 5, y = 5 }
decorations = "None"
opacity = 0.92
blur = true
startup_mode = "Windowed"
title = "Alacritty"
dynamic_title = true

[scrolling]
history = 5000
multiplier = 3

[font]
size = 11.0

[font.normal]
family = "Bitstream Vera Sans Mono"
style  = "Regular"

[font.bold]
family = "Bitstream Vera Sans Mono"
style  = "Bold"

[font.italic]
family = "Bitstream Vera Sans Mono"
style  = "Italic"

[font.bold_italic]
family = "Bitstream Vera Sans Mono"
style  = "Bold Italic"

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = "#0a0810"
foreground = "#ede9f8"
dim_foreground = "#a89bc5"
bright_foreground = "#f5f2ff"

[colors.cursor]
text   = "#0a0810"
cursor = "#9D6EE8"

[colors.vi_mode_cursor]
text   = "#0a0810"
cursor = "#c8b4f0"

[colors.selection]
text       = "CellForeground"
background = "#2d1f45"

[colors.search.matches]
foreground = "#0a0810"
background = "#9D6EE8"

[colors.search.focused_match]
foreground = "#0a0810"
background = "#c8b4f0"

[colors.footer_bar]
background = "#110d1a"
foreground = "#c8b4f0"

# Normal colors (0–7)
[colors.normal]
black   = "#0a0810"   # true black — void
red     = "#e05c7a"   # rose — urgent
green   = "#6eb89a"   # muted teal-green
yellow  = "#c9a0dc"   # violet-gold (warm pastel)
blue    = "#4a8fd4"   # cold blue (ASCII waterfall)
magenta = "#723EC3"   # accent violet
cyan    = "#7ecfcf"   # aqua ghost
white   = "#a89bc5"   # lavender muted

# Bright colors (8–15)
[colors.bright]
black   = "#1a1226"   # dark surface
red     = "#f07a93"   # bright rose
green   = "#8ed4b5"   # bright teal
yellow  = "#e0c0f0"   # bright lavender-gold
blue    = "#6aadee"   # bright cold blue
magenta = "#9D6EE8"   # bright accent
cyan    = "#9de8e8"   # bright aqua
white   = "#ede9f8"   # primary fg

# Dim colors (used for inactive panes)
[colors.dim]
black   = "#06040c"
red     = "#a34358"
green   = "#4e8570"
yellow  = "#8f71a0"
blue    = "#355f8c"
magenta = "#502b8f"
cyan    = "#5a9898"
white   = "#6b6080"

[bell]
animation = "EaseOutExpo"
duration  = 0
color     = "#9D6EE8"

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 600
blink_timeout = 10
unfocused_hollow = true

[terminal]
osc52 = "OnlyCopy"

[mouse]
hide_when_typing = true
